<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10252c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atlas V">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Atlas V: World Conquest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>:root{
  --sea:#17313a;--sea-deep:#10252c;--grat:#9fc4c614;
  --land:#6b6b50;--land-edge:#3d3e2e;
  --brass:#e2ae3b;--brass-hi:#f6d27a;--brass-deep:#9c7322;
  --rival:#b5473a;--rival-hi:#e07a63;
  --panel:#1c221dee;--panel-solid:#1c221d;--panel-2:#262d26;--line:#3c4637;
  --ink:#eee7d4;--muted:#a7a58f;--faint:#7c7d6e;
  --good:#9fd28a;--bad:#e46f5c;--steel:#8fb6c1;
  --display:'Big Shoulders Display','Arial Narrow','Helvetica Neue',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea-deep);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed;opacity:.38}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}

#app{position:fixed;inset:0;overflow:hidden}
#frame{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#1d3a44 0%,var(--sea) 55%,var(--sea-deep) 100%);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#frame.drag{cursor:grabbing}
#world{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.grat{stroke:var(--grat);stroke-width:1;vector-effect:non-scaling-stroke;fill:none}
.ctry{fill:var(--land);stroke:var(--land-edge);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .6s ease}
.ctry[data-c="Africa"]{fill:#716b4f}.ctry[data-c="Europe"]{fill:#676d52}.ctry[data-c="Asia"]{fill:#6c6a4e}
.ctry[data-c="South America"]{fill:#666d4f}.ctry[data-c="North America"]{fill:#6a6c53}.ctry[data-c="Oceania"]{fill:#6e6c55}
.ctry.p{fill:#a17d34!important;stroke:#4d3810}
.ctry.home{fill:#b38b3c!important}
.ctry.r{stroke:#3e1a14}
.ctry.reach{stroke:#efe0ad;stroke-width:1.3}
.ctry.sel{stroke:#fff8df;stroke-width:2.4}
.ctry.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%{filter:brightness(2.3) saturate(.3)}100%{filter:none}}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;display:flex;gap:8px;align-items:stretch;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mark{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 8px;min-width:0}
.mark svg{flex:none}
.mark b{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:.04em;line-height:1;display:block}
.mark small{display:block;color:var(--muted);font-size:11.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.stats{flex:1;display:flex;padding:5px 4px;min-width:0}
.stat{flex:1;padding:0 8px;min-width:0;border-left:1px solid #ffffff12}
.stat:first-child{border-left:0;flex:1.5}
.stat small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2;white-space:nowrap}
.stat b{display:block;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.05;white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.stat small.inc{color:var(--good);font-weight:600}
.clock{display:flex;align-items:center;gap:2px;padding:4px}
.clock .day{padding:0 8px 0 6px;text-align:right}
.clock .day small{display:block;color:var(--muted);font-size:11.5px;line-height:1.1}
.clock .day b{font-family:var(--display);font-weight:700;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.cbtn{min-width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--ink);font-family:var(--display);font-weight:800;font-size:16px;padding:0 4px}
.cbtn:hover{background:#ffffff0d}
.cbtn.on{background:var(--brass);color:#2a1f08}

.chips{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 68px);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;z-index:4;pointer-events:none;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{pointer-events:auto;flex:none;display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;font-size:12.5px;border-radius:999px;animation:chipIn .35s ease-out}
.chip.def{border-color:#7e3328}
@keyframes chipIn{from{transform:translateY(-6px);opacity:0}}
.chip .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#3a2a10;color:var(--brass-hi)}
.chip .dot svg{width:14px;height:14px}
.chip.def .dot{background:#4a1d17;color:var(--rival-hi)}
.chip .bar{width:44px;height:5px;border-radius:3px;background:var(--rival);overflow:hidden}
.chip .bar span{display:block;height:100%;background:var(--brass)}
.chip b{font-weight:600}

.zoom{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:42px;height:42px;border-radius:12px;font-size:21px;display:grid;place-items:center}

/* dock */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:7;padding:0 8px calc(env(safe-area-inset-bottom,0px) + 8px);pointer-events:none}
.dock nav{pointer-events:auto;margin:0 auto;max-width:520px;display:flex;background:var(--panel-solid);border:1px solid var(--line);border-radius:16px;padding:4px;box-shadow:0 10px 30px #0006}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:12px;color:var(--muted);font-size:12px;font-weight:600;position:relative}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink);background:#ffffff0d}
.tab.on svg{color:var(--brass)}
.tab .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--rival);color:#fff;font-size:10.5px;line-height:17px;padding:0 5px;font-weight:700}

/* sheet */
.sheet{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);z-index:6;max-width:520px;margin:0 auto;background:var(--panel-solid);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px #000a;display:flex;flex-direction:column;max-height:min(66dvh,680px);transform:translateY(calc(100% + 140px));transition:transform .32s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.sheet.open{transform:none}
.sh-head{display:flex;align-items:flex-start;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.sh-head h2{margin:0;font-family:var(--display);font-weight:800;font-size:29px;line-height:.95;letter-spacing:.01em}
.sh-head small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.sh-head .x{margin-left:auto;width:36px;height:36px;border-radius:10px;background:#ffffff0c;font-size:20px;display:grid;place-items:center;flex:none}
.sh-head .grow{flex:1;min-width:0}
.sh-body{overflow-y:auto;padding:12px 14px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1}
.sh-foot{border-top:1px solid var(--line);padding:10px 14px 12px;background:#171c18}
.sh-foot:empty{display:none}

.blk{margin-bottom:18px}
.blk:last-child{margin-bottom:0}
.blk h3{font-family:var(--display);font-weight:700;font-size:20px;margin:0 0 8px;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
.blk h3 small{font-family:var(--body);font-size:12.5px;color:var(--muted);font-weight:500;margin-left:auto}
.p{color:var(--muted);margin:0 0 8px;font-size:13.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cell{background:var(--panel-2);border-radius:10px;padding:8px 10px}
.cell small{display:block;color:var(--muted);font-size:12px}
.cell b{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.15;font-variant-numeric:tabular-nums}
.cell em{display:block;font-style:normal;font-size:12px;color:var(--faint)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:#3a2c0f;color:var(--brass-hi);white-space:nowrap}
.tag.r{background:#47201a;color:#f2a08f}
.tag.n{background:#2f362c;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 16px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);font-weight:600;font-size:15px}
.btn.pri{background:var(--brass);border-color:var(--brass);color:#271c06}
.btn.pri:disabled{background:#4a4129;border-color:#4a4129;color:#cbbd96;opacity:1}
.btn.full{width:100%}
.btn.sm{height:34px;font-size:13px;padding:0 12px;border-radius:9px}
.btn.warn{color:#f4a492;border-color:#5b2a22}
.row{display:flex;gap:8px;align-items:center}
.row>.btn{flex:1}

.src{background:var(--panel-2);border-radius:12px;padding:10px;margin-bottom:6px;border:1px solid transparent}
.src.on{border-color:#6b5420;background:#2b2a1d}
.src-top{display:flex;align-items:center;gap:10px}
.tick{width:26px;height:26px;border-radius:7px;border:1.5px solid #6c7562;display:grid;place-items:center;flex:none}
.tick svg{width:15px;height:15px;opacity:0}
.src.on .tick{background:var(--brass);border-color:var(--brass);color:#271c06}
.src.on .tick svg{opacity:1}
.src-name{flex:1;min-width:0}
.src-name b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-name small{color:var(--muted);font-size:12.5px}
.modes{display:flex;gap:4px;margin-top:8px}
.mode{flex:1;height:36px;border-radius:9px;background:#1b201b;border:1px solid var(--line);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted)}
.mode.on{background:#3a2c0f;border-color:var(--brass-deep);color:var(--brass-hi)}
.mode svg{width:17px;height:17px}
.slide{display:flex;align-items:center;gap:10px;margin-top:6px}
.slide input{flex:1;min-width:0}
.slide output{min-width:74px;text-align:right;font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--brass) var(--v,50%),#3b4236 var(--v,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--ink);margin-top:-9px;border:3px solid var(--brass-deep)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#3b4236}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--brass)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--ink);border:3px solid var(--brass-deep)}

.pkg{background:var(--panel-2);border-radius:12px;padding:10px;margin-bottom:6px}
.pkg-top{display:flex;align-items:center;gap:10px}
.ic{width:36px;height:36px;border-radius:9px;background:#1b201b;display:grid;place-items:center;flex:none;color:var(--brass-hi)}
.ic svg{width:21px;height:21px}
.pkg-name{flex:1;min-width:0}
.pkg-name b{display:block;font-weight:600}
.pkg-name small{color:var(--muted);font-size:12.5px;display:block;line-height:1.3}
.pkg-cost{font-family:var(--display);font-weight:700;font-size:17px;color:var(--brass-hi);white-space:nowrap}
.lvls{display:flex;gap:4px;margin-top:8px}
.lvl{flex:1;height:34px;border-radius:8px;background:#1b201b;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.lvl.on{background:var(--brass);border-color:var(--brass);color:#271c06}
.pkg.locked{opacity:.5}

.odds{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.gauge{position:relative;width:66px;height:66px;flex:none}
.gauge svg{width:66px;height:66px;transform:rotate(-90deg)}
.gauge b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;line-height:1;text-align:center}
.odds-txt{flex:1;min-width:0}
.odds-txt b{font-weight:600;display:block}
.odds-txt small{color:var(--muted);font-size:12.5px;display:block}
.cost{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:1px 0}
.cost span:last-child{color:var(--ink);font-variant-numeric:tabular-nums}
.cost.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;color:var(--ink);font-weight:600}
.short,.cost .short{color:var(--bad)!important}

.op{background:var(--panel-2);border-radius:12px;padding:10px;margin-bottom:6px}
.op.def{box-shadow:inset 3px 0 0 var(--rival)}
.op-top{display:flex;align-items:center;gap:8px}
.op-top b{flex:1;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op small{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
.prog{height:6px;border-radius:3px;background:#1b201b;margin:8px 0 6px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--brass);border-radius:3px}
.duel{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0 4px;background:#1b201b}
.duel .a{background:var(--brass)}
.duel .d{background:var(--rival)}
.op .row{margin-top:8px}

.up{background:var(--panel-2);border-radius:12px;padding:10px;margin-bottom:6px;display:flex;gap:10px;align-items:center}
.up .ic{width:42px;height:42px}
.up-txt{flex:1;min-width:0}
.up-txt b{font-weight:600;display:block}
.up-txt small{color:var(--muted);font-size:12.5px;display:block;line-height:1.3}
.pips{display:flex;gap:3px;margin-top:6px}
.pips i{width:12px;height:4px;border-radius:2px;background:#3b4236}
.pips i.on{background:var(--brass)}

.log{list-style:none;margin:0;padding:0}
.log li{padding:8px 0;border-bottom:1px solid #ffffff0e;font-size:13px;color:var(--muted)}
.log li b{color:var(--ink);font-weight:600;display:block}
.log li time{float:right;font-size:12px;color:var(--faint);margin-left:8px}
.rank{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #ffffff0e}
.rank i{width:14px;height:14px;border-radius:4px;flex:none}
.rank span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank b{font-family:var(--display);font-weight:700;font-size:17px}
.search{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:#141914;padding:0 14px;font-size:16px}
.results button{display:flex;width:100%;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid #ffffff0e;text-align:left;gap:8px}
.results small{color:var(--muted)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.quick button{background:var(--panel-2);border-radius:11px;padding:10px;text-align:left}
.quick b{display:block;font-weight:600}
.quick small{color:var(--muted);font-size:12.5px}
.d0{color:var(--good)}.d1{color:var(--brass-hi)}.d2{color:#f0a868}.d3{color:var(--bad)}

.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 112px);transform:translate(-50%,-10px);background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;opacity:0;transition:.3s;z-index:9;pointer-events:none;max-width:88vw;text-align:center;box-shadow:0 10px 30px #0008}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:#7e3328;color:#f6b3a5}
.toast.good{border-color:var(--brass-deep);color:var(--brass-hi)}
.veil{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at center,#0d1c20b0,#060d0fea)}
.veil.show{display:flex}
.card{max-width:430px;width:100%;background:var(--panel-solid);border:1px solid var(--line);border-radius:20px;padding:22px 20px 18px;box-shadow:0 30px 80px #000c;max-height:calc(100dvh - 40px);overflow-y:auto}
.card h1{font-family:var(--display);font-weight:900;font-size:64px;line-height:.82;margin:0 0 12px;letter-spacing:.01em}
.card h2{font-family:var(--display);font-weight:800;font-size:36px;line-height:.95;margin:0 0 10px}
.card p{color:var(--muted);margin:0 0 14px}
.steps{margin:0 0 18px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;padding:5px 0;font-size:14px}
.steps li:before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:#3a2c0f;color:var(--brass-hi);font-weight:700;font-size:12px;display:grid;place-items:center;margin-top:1px}
.stripe{height:5px;display:flex;gap:4px;margin-bottom:16px}
.stripe i{border-radius:3px}

@media (min-width:980px){
  .sheet{left:auto;right:12px;top:calc(env(safe-area-inset-top,0px) + 72px);bottom:98px;width:420px;max-height:none;margin:0;transform:translateX(calc(100% + 30px))}
  .sheet.open{transform:none}
  .zoom{right:auto;left:12px}
  .chips{right:450px}
  .mark small{max-width:220px}
}
@media (max-width:620px){
  .stat.opt{display:none}
  .mark small{display:none}
  .mark b{font-size:18px}
  .stat b,.clock .day b{font-size:18px}
  .zoom{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:none}
  .zoom .opt{display:none}
}
@media (max-width:390px){.mark{display:none}.stat{padding:0 6px}.cbtn{min-width:34px}}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.ctry.flash{animation:none}.chip{animation:none}}

.foot-row{display:flex;align-items:center;gap:12px}
.foot-row .gauge{width:54px;height:54px}
.foot-row .gauge svg{width:54px;height:54px}
.foot-tot{text-align:right;flex:none}
.foot-tot small{display:block;color:var(--muted);font-size:12px}
.foot-tot b{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M3 16h26M16 3c-5 4-5 22 0 26M16 3c5 4 5 22 0 26" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 9l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5-3.7-3.4 5-.6z" fill="#e2ae3b"/></symbol>

<script>'use strict';
/* ================= Atlas V: core engine ================= */
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const COUNTRY=new Map(COUNTRIES.map(c=>[c.id,c])),COUNT=COUNTRIES.length,STORE='atlasV_rework_v1';
const DAY_SEC=2.4,SPEEDS=[1,3,8];
const MOUNT=new Set(['Afghanistan','Nepal','Bhutan','Switzerland','Peru','Bolivia','Austria','Tajikistan','Kyrgyzstan','Ethiopia','Mongolia','Lesotho','Armenia','Georgia']);
const CONTS=[...new Set(COUNTRIES.map(c=>c.cont))];

/* Derived military/economic profile per country */
for(const c of COUNTRIES){
  c.t0=Math.max(800,Math.round(c.m*.015));                 // standing army
  const gpm=Math.max(500,c.gdp*1e6/Math.max(1000,c.m));     // output per working male
  c.q=clamp(.5+.25*Math.log10(gpm/1000),.45,1.15);          // equipment / training quality
  c.inc=Math.max(.04,c.gdp/365*.03);                        // defence budget, £M per day
  c.res0=Math.round(c.t0*.8);                               // mobilisable reserves
  c.terr=MOUNT.has(c.n)?1.22:1;
}

/* ---------- formatting ---------- */
const fmt=n=>Math.round(n||0).toLocaleString('en-GB');
const brief=n=>{n=Math.max(0,n||0);return n>=1e6?(n/1e6).toFixed(n>=1e7?1:2)+'M':n>=1e4?Math.round(n/1e3)+'K':n>=1e3?(n/1e3).toFixed(1)+'K':String(Math.round(n))};
const money=m=>{const a=Math.abs(m),s=m<0?'−':'';return a>=1e6?s+'£'+(a/1e6).toFixed(a>=1e7?0:1)+'T':a>=1000?s+'£'+(a/1000).toFixed(a>=1e5?0:1)+'B':a>=10?s+'£'+Math.round(a)+'M':a>=1?s+'£'+a.toFixed(1)+'M':s+'£'+Math.round(a*1000)+'K'};
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const pct=v=>Math.round(v*100)+'%';

/* ---------- geometry ---------- */
function distance(a,b){const la1=(90-a[1]/4)*Math.PI/180,la2=(90-b[1]/4)*Math.PI/180,lo1=(a[0]/4-180)*Math.PI/180,lo2=(b[0]/4-180)*Math.PI/180;const z=Math.sin((la2-la1)/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin((lo2-lo1)/2)**2;return 12742*Math.asin(Math.min(1,Math.sqrt(z)))}
const wideDiff=(a,b)=>{let dx=b[0]-a[0];return Math.abs(dx)>720?(dx>0?dx-1440:dx+1440):dx};
const paths={};
const borderCache=new Map(),coastCache=new Map();
function entryPoint(from,to){const key=from+':'+to;if(borderCache.has(key))return borderCache.get(key);
  const a=COUNTRY.get(from),b=COUNTRY.get(to),p=paths[from],q=paths[to],mid=[(a.c[0]+b.c[0])/2,(a.c[1]+b.c[1])/2];let point=mid;
  if(p&&q){const lp=p.getTotalLength(),lq=q.getTotalLength(),na=clamp(Math.round(lp/2),40,500),nb=clamp(Math.round(lq/2),40,500),sb=[];
    for(let j=0;j<=nb;j++){const x=q.getPointAtLength(lq*j/nb);sb.push([x.x,x.y])}
    let best=Infinity,shared=[];for(let i=0;i<=na;i++){const x=p.getPointAtLength(lp*i/na);let near=Infinity,np=null;for(const y of sb){const d=(x.x-y[0])**2+(x.y-y[1])**2;if(d<near){near=d;np=y}}
      const m=[(x.x+np[0])/2,(x.y+np[1])/2];if(near<1.2)shared.push(m);if(near<best){best=near;point=m}}
    // prefer the stretch of shared border closest to the line between the two capitals
    if(shared.length){let bd=Infinity;for(const m of shared){const d=(m[0]-mid[0])**2+(m[1]-mid[1])**2;if(d<bd){bd=d;point=m}}}}
  borderCache.set(key,point);return point}
function coastal(id){if(coastCache.has(id))return coastCache.get(id);const c=COUNTRY.get(id),path=paths[id];if(!path||!c.ports){coastCache.set(id,[]);return[]}
  const nb=[];for(const a of c.adj){const p=paths[a];if(!p)continue;const L=p.getTotalLength(),n=clamp(Math.ceil(L/1.4),30,500);for(let k=0;k<n;k++){const x=p.getPointAtLength(L*k/n);nb.push([x.x,x.y])}}
  const L=path.getTotalLength(),n=clamp(Math.ceil(L/1.2),80,900),cand=[],all=[];
  for(let i=0;i<n;i++){const s=path.getPointAtLength(L*i/n),p=[s.x,s.y];let near=Infinity;for(const q of nb){const d=(p[0]-q[0])**2+(p[1]-q[1])**2;if(d<near)near=d}all.push([p,near]);if(near>3.2)cand.push(p)}
  let out=cand;if(!out.length&&all.length){all.sort((a,b)=>b[1]-a[1]);out=[all[0][0]]}
  coastCache.set(id,out);return out}
function coastPoint(id,toward){const list=coastal(id);if(!list.length)return COUNTRY.get(id).c;let best=Infinity,sel=list[0];for(const p of list){const d=distance(p,toward);if(d<best){best=d;sel=p}}return sel}
function inward(edge,id,amt){const c=COUNTRY.get(id).c,dx=wideDiff(edge,c),dy=c[1]-edge[1],d=Math.hypot(dx,dy)||1;return[edge[0]+dx/d*Math.min(amt,d*.35),edge[1]+dy/d*Math.min(amt,d*.35)]}
/* Unwrap a polyline so it is continuous across the date line */
function unwrap(pts){const out=[pts[0].slice()];for(let i=1;i<pts.length;i++){const prev=out[i-1],p=pts[i].slice();while(p[0]-prev[0]>720)p[0]-=1440;while(p[0]-prev[0]<-720)p[0]+=1440;out.push(p)}return out}

/* ---------- state ---------- */
const newGame=()=>({v:1,phase:'setup',home:null,selected:null,owner:{},forces:{},res:{},fort:{},occ:{},intel:{},ops:[],money:0,day:1,speed:1,paused:false,
  lv:{inf:1,navy:1,air:1,ind:1,log:1},log:[],st:{won:0,lost:0,spent:0,kills:0,deaths:0,peak:1},aiNext:14,nid:1,u:1,mob:0});
let game=newGame();
const own=id=>game.owner[id]??String(id);
const mine=id=>own(id)==='P';
const gar=id=>game.forces[id]??COUNTRY.get(id).t0;
const resv=id=>game.res[id]??COUNTRY.get(id).res0;
const owned=()=>COUNTRIES.filter(c=>mine(c.id)).map(c=>c.id);
let ownedCache=null;const ownedList=()=>ownedCache||(ownedCache=owned());
const dirty=()=>{ownedCache=null};
const homeQ=()=>game.home==null?1:COUNTRY.get(game.home).q*(1+.06*(game.lv.inf-1));
function qOf(id){const o=own(id);return o==='P'?homeQ():o===String(id)?COUNTRY.get(id).q:COUNTRY.get(+o).q}
function capOf(id){const c=COUNTRY.get(id);return c.t0*(mine(id)?1.25+.05*(game.lv.inf-1):1.2)}
function fortMult(id){const o=own(id),c=COUNTRY.get(id);const f=o==='P'?1.25+.15*(game.fort[id]||0):o===String(id)?1.3:1.18;return f*c.terr}
const defMult=id=>qOf(id)*fortMult(id);
function addLog(title,desc,kind=''){game.log.unshift({d:Math.floor(game.day),title,desc,kind});game.log.length=Math.min(game.log.length,60)}

/* ---------- economy ---------- */
function contOwned(cont){return COUNTRIES.every(c=>c.cont!==cont||mine(c.id))}
function income(){let sum=0;const full=new Set(CONTS.filter(contOwned));for(const id of ownedList()){const c=COUNTRY.get(id);let f=1;if(game.occ[id]!=null)f=clamp(.35+(game.day-game.occ[id])/25*.65,.35,1);sum+=c.inc*f*(full.has(c.cont)?1.2:1)}return sum*(1+.12*(game.lv.ind-1))}
const disc=()=>1-.07*(game.lv.log-1);
const troopsTotal=()=>ownedList().reduce((v,id)=>v+gar(id),0)+game.ops.filter(o=>o.side==='P').reduce((v,o)=>v+o.troops,0);
const UP={
  inf:{name:'Infantry training',icon:'people',base:6,desc:l=>l>=8?`+${(l-1)*6}% combat quality. Fully trained.`:`Now +${(l-1)*6}% combat quality. Next level: +${l*6}% and faster recruitment.`},
  navy:{name:'Naval dockyards',icon:'naval',base:7,desc:l=>l>=8?`Sea range ${fmt(navyRange())} km.`:`Sea range ${fmt(navyRange())} km. Next level: ${fmt(navyRange()+1500)} km and 30% more sealift.`},
  air:{name:'Air force',icon:'air',base:7,desc:l=>l>=8?`Air range from ${fmt(1400+l*800)} km.`:`Air range from ${fmt(1400+l*800)} km. Next level: ${fmt(2200+l*800)} km, bigger airlifts, stronger strikes.`},
  ind:{name:'War industry',icon:'coin',base:9,desc:l=>l>=8?`Income +${(l-1)*12}%.`:`Now +${(l-1)*12}% income. Next level: +${l*12}%.`},
  log:{name:'Logistics corps',icon:'crate',base:6,desc:l=>l>=8?`Operation costs −${(l-1)*7}%.`:`Now −${(l-1)*7}% on operation costs. Next level: −${l*7}%.`},
};
const upCost=k=>{const base=Math.max(game.u*COUNTRY.get(game.home).t0,income())*UP[k].base;return base*Math.pow(1.65,game.lv[k]-1)};

/* ---------- reach & routes ---------- */
const navyRange=()=>2600+game.lv.navy*1500;
const airRange=from=>1400+game.lv.air*800+Math.min(3000,from.air*25);
const seaCap=from=>Math.floor(from.ports*30000*(1+.3*(game.lv.navy-1)));
const airCap=from=>Math.floor(from.air*5000*(1+.35*(game.lv.air-1)));
function landChain(from,to,fac='P'){if(from===to)return[from];const q=[from],seen=new Set(q),prev=new Map();
  for(let i=0;i<q.length;i++){const cur=q[i];for(const nx of COUNTRY.get(cur).adj){if(seen.has(nx))continue;if(nx!==to&&own(nx)!==fac)continue;prev.set(nx,cur);seen.add(nx);
    if(nx===to){const r=[to];while(r[0]!==from)r.unshift(prev.get(r[0]));return r}q.push(nx)}}return null}
function routeFor(from,to,type,chain){
  const a=COUNTRY.get(from),b=COUNTRY.get(to),friendly=own(to)===own(from);let legs,front;
  if(type==='land'){const pts=[a.c];for(let i=1;i<chain.length;i++){const e=entryPoint(chain[i-1],chain[i]);pts.push(e);if(i<chain.length-1)pts.push(COUNTRY.get(chain[i]).c)}
    front=friendly?b.c:inward(pts[pts.length-1],to,2.2);if(friendly)pts.push(b.c);else pts.push(front);legs=[{k:'land',pts:unwrap(pts)}]}
  else if(type==='naval'){const dep=coastPoint(from,b.c),land=coastPoint(to,a.c);front=friendly?b.c:inward(land,to,1.6);
    const l1=unwrap([a.c,dep]),sea=unwrap(arcPts(...unwrap([dep,land]),.12));const l3=unwrap([land,front]);legs=[{k:'land',pts:l1},{k:'sea',pts:sea},{k:'beach',pts:l3}]}
  else{const dz=friendly?b.c:(()=>{const c=b.c,dx=wideDiff(c,a.c),dy=a.c[1]-c[1],d=Math.hypot(dx,dy)||1;return[c[0]+dx/d*Math.min(5,d*.2),c[1]+dy/d*Math.min(5,d*.2)]})();front=dz;legs=[{k:'air',pts:unwrap(arcPts(...unwrap([a.c,dz]),-.18))}]}
  // stitch legs into one continuous polyline
  let all=[],marks=[];for(const l of legs){let p=l.pts;if(all.length){const last=all[all.length-1];const shift=Math.round((last[0]-p[0][0])/1440)*1440;p=p.map(q=>[q[0]+shift,q[1]])}marks.push({k:l.k,start:all.length?all.length-1:0});all=all.concat(all.length?p.slice(1):p);marks[marks.length-1].end=all.length-1}
  const km=type==='land'?all.slice(1).reduce((v,p,i)=>v+distance(all[i],p),0):type==='naval'?distance(a.c,coastPoint(from,b.c))+distance(coastPoint(from,b.c),coastPoint(to,a.c))*1.1+60:distance(a.c,b.c);
  return{pts:all,legs:marks,front,km:Math.round(km)}}
function travelDays(type,km){const l=game.lv;return type==='land'?Math.max(1.2,km/(280+25*l.inf)):type==='naval'?Math.max(1.5,km/(800+120*l.navy)+1):Math.max(.7,km/(2600+300*l.air))}
function optionsFor(target){const out=[];if(game.phase!=='play')return out;const T=COUNTRY.get(target);
  for(const id of ownedList()){if(id===target)continue;const from=COUNTRY.get(id),avail=gar(id);if(avail<200)continue;const chain=landChain(id,target);
    for(const k of ['land','naval','air']){let ok=false;
      if(k==='land')ok=!!chain;
      else if(k==='naval')ok=from.ports>0&&T.ports>0&&distance(coastPoint(id,T.c),coastPoint(target,from.c))<=navyRange();
      else ok=from.air>0&&distance(from.c,T.c)<=airRange(from);
      if(!ok)continue;const lim=k==='land'?avail:Math.min(avail,k==='naval'?seaCap(from):airCap(from));if(lim<200)continue;
      const r=routeFor(id,target,k,chain);out.push({from:id,type:k,max:Math.floor(lim),km:r.km,days:travelDays(k,r.km),route:r,chain})}}
  return out}

/* ---------- operation costs & effects ---------- */
const SUP={
  air:{pre:[0,.06,.12,.18],b:[0,.08,.16,.26],c:[0,2.5,6,11]},
  arm:{b:[0,.12,.26,.42],c:[0,2,5,9]},
  nav:{pre:[0,.04,.08,.12],b:[0,.05,.10,.16],c:[0,2,4.75,8.5]},
};
const REC={err:[.4,.2,.08,0],b:[0,0,.05,.1],c:[0,.25,.6,1.2]};
const TRANS={land:1.1,naval:2,air:4};
const SUPPLY_RATE=.6;
const reconLvl=id=>{const r=game.intel[id];return r&&r.until>game.day?r.lvl:0};
const reconCost=(id,l)=>Math.max(.2,COUNTRY.get(id).t0*game.u*REC.c[l]);
function transportCost(type,troops,km){let r=TRANS[type];if(type==='naval')r*=1-.06*(game.lv.navy-1);if(type==='air')r*=1-.06*(game.lv.air-1);return troops*game.u*(km/1000)*r*disc()}
const supplyCost=(troops,days)=>troops*game.u*SUPPLY_RATE*days*disc();
function packageCost(kind,lvl,waves){if(!lvl)return 0;let t=0;for(const w of waves)t+=w.troops*(kind==='arm'?(w.type==='land'?1:w.type==='naval'?.6:.3):1);return t*game.u*SUP[kind].c[lvl]*disc()}
const typeMod=(type,side)=>{const l=side==='P'?game.lv:{navy:1,air:1};return type==='land'?1:type==='naval'?.82+.02*(l.navy-1):.72+.025*(l.air-1)};
function opPower(type,sup,side,q){const armEff=type==='land'?1:type==='naval'?.6:.3,airK=side==='P'?1+.05*(game.lv.air-1):1;
  const bonus=SUP.air.b[sup.air||0]*airK+SUP.arm.b[sup.arm||0]*armEff+SUP.nav.b[sup.nav||0]+(REC.b[sup.rec||0]||0);return q*typeMod(type,side)*(1+bonus)}
const preStrike=sup=>Math.min(.32,SUP.air.pre[sup.air||0]*(1+.05*(game.lv.air-1))+SUP.nav.pre[sup.nav||0]);

/* ---------- combat model (shared by live battles and the odds forecaster) ---------- */
const LOSS_K=.06,RES_RATE=.04,MAX_DAYS=40;
function combatRound(st,rng){let A=0,T=0;for(const x of st.a){if(x.t<=0)continue;A+=x.t*x.pw*(x.sup>0?1:.55);T+=x.t}
  if(T<=0)return'D';
  const inflow=Math.min(st.r,st.r0*RES_RATE);st.d+=inflow;st.r-=inflow;
  const D=st.d*st.dm,aLoss=LOSS_K*D*(.7+rng()*.6),dLoss=LOSS_K*A/st.dm*(.7+rng()*.6);
  let lostA=0;for(const x of st.a){if(x.t<=0)continue;const h=Math.min(x.t,aLoss/x.pw*(x.t/T)*(x.sup>0?1:1.35));x.t-=h;lostA+=h;x.sup--}
  const lostD=Math.min(st.d,dLoss);st.d-=lostD;st.days++;st.la=(st.la||0)+lostA;st.ld=(st.ld||0)+lostD;
  const T2=st.a.reduce((v,x)=>v+Math.max(0,x.t),0);
  if(st.d<T2*.2)return'A';if(T2<st.init*.3||st.days>=MAX_DAYS)return'D';return null}
function overwhelms(A,d,r,dm){return A>4*(d+r)*dm}
/* Monte Carlo forecast */
function forecast(waves,defTroops,resTroops,dm,pre,n=90){if(!waves.length)return{p:0,days:0,loss:0};
  let win=0,days=0,loss=0;const init=waves.reduce((v,w)=>v+w.t,0);let seed=12345;const rng=()=>((seed=(seed*16807)%2147483647)/2147483647);
  const A0=waves.reduce((v,w)=>v+w.t*w.pw,0);
  if(overwhelms(A0,defTroops*(1-pre),resTroops,dm))return{p:1,days:1,loss:0};
  for(let i=0;i<n;i++){const f=Math.exp((rng()+rng()+rng()-1.5)*.35);const st={a:waves.map(w=>({t:w.t,pw:w.pw*f,sup:w.sup})),d:defTroops*(1-pre),r:resTroops,r0:Math.max(resTroops,1),dm,init,days:0};
    let r;while(!(r=combatRound(st,rng)));if(r==='A')win++;days+=st.days;loss+=st.la}
  return{p:win/n,days:days/n,loss:loss/n}}

/* ---------- launching ---------- */
function launchOp(o){game.ops.push(o);return o}
function makeOp(side,fac,opt,troops,sup,transfer,cid){const q=side==='P'?homeQ():COUNTRY.get(+fac).q;
  return{id:game.nid++,cid:cid||0,side,fac,from:opt.from,to:opt.to??opt.target,type:opt.type,pts:opt.route.pts,legs:opt.route.legs,front:opt.route.front,km:opt.route.km,dur:opt.days,el:0,
    stage:'travel',troops,init:troops,transfer,sup:{...sup},supLeft:sup.days||0,pw:opPower(opt.type,sup,side,q),fortune:Math.exp((Math.random()+Math.random()+Math.random()-1.5)*.35),chain:opt.chain||null,bd:0,bt:0,struck:false,t0:game.day}}

/* ---------- AI ---------- */
function aiTurn(){const cands=[],threat=[];const pOwned=ownedList().length;
  const busy=new Set(game.ops.filter(o=>o.side==='AI').map(o=>o.from));
  for(const c of COUNTRIES){const f=own(c.id);if(f==='P'||busy.has(c.id))continue;const army=gar(c.id);if(army<2000)continue;const q=COUNTRY.get(+f).q;
    for(const id of c.adj){if(own(id)===f)continue;const def=gar(id)*defMult(id)+resv(id)*defMult(id)*.5;const adv=army*q/(def+1);if(adv<1.4||adv>30)continue;
      const entry={from:c.id,to:id,fac:f,army,adv};if(mine(id))threat.push(entry);else cands.push(entry)}}
  const pickW=arr=>{const tot=arr.reduce((v,x)=>v+Math.min(4,x.adv),0);let r=Math.random()*tot;for(const x of arr){r-=Math.min(4,x.adv);if(r<=0)return x}return arr[arr.length-1]};
  const launches=[];const n=Math.random()<.5?1:2;for(let i=0;i<n&&cands.length;i++){const x=pickW(cands);launches.push(x);cands.splice(cands.indexOf(x),1)}
  const pThreat=clamp(.12+pOwned*.025,.12,.7);if(threat.length&&Math.random()<pThreat)launches.push(pickW(threat));
  for(const x of launches){const chain=landChain(x.from,x.to,x.fac)||[x.from,x.to];const r=routeFor(x.from,x.to,'land',chain);const amt=Math.round(x.army*(.45+Math.random()*.35));
    const lvl=Math.floor(Math.random()*3),sup={air:lvl,arm:Math.floor(Math.random()*3),nav:0,rec:0,days:999};
    const o=makeOp('AI',x.fac,{from:x.from,to:x.to,type:'land',route:r,days:travelDays('land',r.km)*1.15,chain},amt,sup,false);o.supLeft=999;
    game.forces[x.from]=gar(x.from)-amt;launchOp(o);
    const fa=COUNTRY.get(+x.fac).n,tn=COUNTRY.get(x.to).n;
    if(mine(x.to)){addLog(`${tn} under threat`,`${fa} is marching ${brief(amt)} troops on your territory.`,'bad');toast(`${fa} is invading ${tn}`,'bad')}
    else addLog('Rival offensive',`${fa} sends ${brief(amt)} troops into ${tn}.`)}}

/* ---------- battle resolution ---------- */
function battleState(group){const to=group[0].to;return{a:group.map(o=>({t:o.troops,pw:o.pw*o.fortune,sup:o.supLeft})),d:gar(to),r:resv(to),r0:COUNTRY.get(to).res0,dm:defMult(to),init:group.reduce((v,o)=>v+o.init,0),days:group[0].bd}}
function resolve(group,winner){const lead=group[0],to=lead.to,T=COUNTRY.get(to),fac=lead.side==='P'?'P':lead.fac,prev=own(to),surv=group.reduce((v,o)=>v+o.troops,0),lost=group.reduce((v,o)=>v+(o.init-o.troops),0);
  game.ops=game.ops.filter(o=>!group.includes(o));
  if(winner==='A'){game.owner[to]=fac;game.forces[to]=Math.max(200,Math.round(surv));game.res[to]=0;delete game.intel[to];delete game.fort[to];dirty();
    if(fac==='P'){game.occ[to]=game.day;const spoils=T.inc*12;game.money+=spoils;game.st.won++;game.st.peak=Math.max(game.st.peak,ownedList().length);
      addLog(`${T.n} captured`,`${group.length>1?group.length+' columns':'Your forces'} took ${T.n}. Spoils ${money(spoils)}. ${brief(lost)} lost.`,'good');toast(`${T.n} captured · +${money(spoils)}`,'good');
      FX.capture(to,'P');checkContinent(T.cont)}
    else{if(prev==='P'){delete game.occ[to];addLog(`${T.n} lost`,`${COUNTRY.get(+fac).n} overran your garrison.`,'bad');toast(`${T.n} has fallen`,'bad');if(to===game.home)addLog('Homeland occupied','Your capital has fallen. Income will suffer.','bad')}
      else addLog('Border changed',`${COUNTRY.get(+fac).n} conquered ${T.n}.`);FX.capture(to,fac)}}
  else{for(const o of group){if(own(o.from)===fac)game.forces[o.from]=gar(o.from)+Math.round(o.troops*.7)}
    if(fac==='P'){game.st.lost++;addLog(`Assault on ${T.n} failed`,`${brief(lost)} troops lost. Survivors fell back.`,'bad');toast(`Assault on ${T.n} failed`,'bad')}
    else if(mine(to)){addLog(`${T.n} held`,`Your garrison repelled ${COUNTRY.get(+fac).n}.`,'good');toast(`${T.n} held the line`,'good')}
    FX.repel(group)}
  if(game.phase==='play'){if(!ownedList().length){game.phase='over';save();UI.endCard(false)}else if(ownedList().length===COUNT){game.phase='won';save();UI.endCard(true)}}
  UI.refresh(true)}
function checkContinent(cont){if(contOwned(cont)){addLog(`${cont} unified`,'Every country on the continent is yours: +20% income there.','good');toast(`${cont} unified · +20% income`,'good')}}
function startBattle(group,arrivals){const to=group[0].to;
  for(const o of arrivals){if(!o.struck){o.struck=true;const pre=o.side==='P'?preStrike(o.sup):Math.min(.2,(o.sup.air||0)*.05);if(pre>0){const k=Math.round(gar(to)*pre);game.forces[to]=gar(to)-k;if(o.side==='P')game.st.kills+=k}}}
  const A=group.reduce((v,o)=>v+o.troops*o.pw*o.fortune,0);
  if(overwhelms(A,gar(to),resv(to),defMult(to)))group.forEach(o=>o.rout=true);
  return false}

/* ---------- simulation ---------- */
function regen(step){for(const c of COUNTRIES){const id=c.id;const cap=capOf(id),g=gar(id);
    const rate=mine(id)?.012*(1+.15*(game.lv.inf-1)):.008;if(g<cap)game.forces[id]=Math.min(cap,g+cap*rate*step);
    if(game.res[id]!=null&&game.res[id]<c.res0)game.res[id]=Math.min(c.res0,game.res[id]+c.res0*.006*step)}}
function simulate(days){if(game.phase!=='play'||game.paused)return;let left=Math.min(days,6);
  while(left>1e-9){const step=Math.min(left,.25);left-=step;const before=Math.floor(game.day);game.day+=step;const newDay=Math.floor(game.day)>before;
    game.money+=income()*step;regen(step);
    const done=[];
    for(const o of game.ops){const fac=o.side==='P'?'P':o.fac;
      if(o.stage==='travel'){
        if(o.type==='land'&&o.chain&&o.chain.length>2&&o.chain.slice(0,-1).some(id=>own(id)!==fac)){done.push(o);if(own(o.from)===fac)game.forces[o.from]=gar(o.from)+o.troops;if(o.side==='P'){addLog('Column recalled',`The corridor to ${COUNTRY.get(o.to).n} was cut.`,'bad')}continue}
        o.el+=step;if(o.el>=o.dur){o.el=o.dur;
          if(own(o.to)===fac){game.forces[o.to]=gar(o.to)+o.troops;done.push(o);if(o.side==='P'&&o.transfer)addLog('Reinforcements arrived',`${brief(o.troops)} troops reached ${COUNTRY.get(o.to).n}.`)}
          else if(o.transfer){done.push(o);if(own(o.from)===fac)game.forces[o.from]=gar(o.from)+o.troops;if(o.side==='P')addLog('Transfer aborted',`${COUNTRY.get(o.to).n} changed hands before arrival.`,'bad')}
          else{o.stage='battle';o.bd=0;o.bt=0;o.newly=true;if(o.side==='P')addLog(`Landing at ${COUNTRY.get(o.to).n}`,`${brief(o.troops)} troops engage ${brief(gar(o.to))} defenders.`)}}}
      else if(o.stage==='battle')o.bt+=step}
    if(done.length)game.ops=game.ops.filter(o=>!done.includes(o));
    // group battles by target + attacking faction
    const groups=new Map();for(const o of game.ops){if(o.stage!=='battle')continue;const k=o.to+'/'+(o.side==='P'?'P':o.fac);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(o)}
    for(const g of groups.values()){if(!g.every(o=>game.ops.includes(o)))continue;const fac=g[0].side==='P'?'P':g[0].fac;
      if(own(g[0].to)===fac){for(const o of g){game.forces[o.to]=gar(o.to)+o.troops}game.ops=game.ops.filter(o=>!g.includes(o));continue}
      const fresh=g.filter(o=>o.newly);if(fresh.length){fresh.forEach(o=>o.newly=false);if(startBattle(g,fresh))continue}
      if(g.some(o=>o.bt>=1)){g.forEach(o=>o.bt=Math.max(0,o.bt-1));
        if(g.some(o=>o.rout)){const lost=Math.round(gar(g[0].to)*.85);if(fac==='P')game.st.kills+=lost;game.forces[g[0].to]=gar(g[0].to)-lost;g.forEach(o=>{o.troops=Math.round(o.troops*.985)});resolve(g,'A');continue}
        const st=battleState(g);st.days=Math.max(...g.map(o=>o.bd));const res=combatRound(st,Math.random);
        g.forEach((o,i)=>{const lost=o.troops-st.a[i].t;o.troops=Math.max(0,st.a[i].t);o.supLeft=st.a[i].sup;o.bd=st.days;if(o.side==='P')game.st.deaths+=lost});
        if(fac==='P')game.st.kills+=st.ld||0;
        game.forces[g[0].to]=Math.max(0,st.d);game.res[g[0].to]=Math.max(0,st.r);
        if(fac==='P'&&g.some(o=>o.supLeft===0))toast(`Supplies exhausted at ${COUNTRY.get(g[0].to).n}`,'bad');
        if(res)resolve(g,res)}}
    if(game.day>=game.aiNext){aiTurn();game.aiNext=game.day+7+Math.random()*9}
    if(newDay)game.st.peak=Math.max(game.st.peak,ownedList().length)}}

/* ---------- player actions ---------- */
function startEmpire(id){const c=COUNTRY.get(id);game=newGame();game.phase='play';game.home=id;game.selected=null;game.owner[id]='P';dirty();
  game.u=c.inc/c.t0;game.money=c.inc*14;game.forces[id]=c.t0;game.aiNext=10;
  addLog('Empire founded',`${c.n} begins its campaign with ${brief(c.t0)} troops and ${money(game.money)}.`,'good');save()}
function spend(n){game.money-=n;game.st.spent+=n}
function buyRecon(id,l){const cost=reconCost(id,l);if(game.money<cost)return false;spend(cost);game.intel[id]={lvl:l,until:game.day+30};addLog('Reconnaissance',`Intelligence on ${COUNTRY.get(id).n} upgraded.`);return true}
function buyUpgrade(k){const cost=upCost(k);if(game.money<cost||game.lv[k]>=8)return false;spend(cost);game.lv[k]++;addLog(UP[k].name,`Raised to level ${game.lv[k]}.`,'good');return true}
const fortCost=id=>COUNTRY.get(id).t0*game.u*2.2*Math.pow(1.6,game.fort[id]||0);
function buyFort(id){if(!mine(id))return false;const l=game.fort[id]||0;if(l>=3)return false;const c=fortCost(id);if(game.money<c)return false;spend(c);game.fort[id]=l+1;addLog('Fortifications',`${COUNTRY.get(id).n} defences raised to level ${l+1}.`);return true}
const mobCost=()=>ownedList().reduce((v,id)=>v+COUNTRY.get(id).t0,0)*game.u*3.5*(1+.5*game.mob);
function mobilise(){const cost=mobCost();if(game.money<cost)return false;spend(cost);game.mob++;let added=0;for(const id of ownedList()){const a=Math.round(COUNTRY.get(id).t0*.18);game.forces[id]=gar(id)+a;added+=a}addLog('General mobilisation',`${brief(added)} conscripts called up across the empire.`,'good');return added}
function resupply(o,days=6){const cost=supplyCost(o.troops,days);if(game.money<cost)return false;spend(cost);o.supLeft=Math.max(0,o.supLeft)+days;return true}
function withdraw(o){if(!game.ops.includes(o))return;game.ops=game.ops.filter(x=>x!==o);const back=o.stage==='battle'?.75:1;if(mine(o.from))game.forces[o.from]=gar(o.from)+Math.round(o.troops*back);else{const h=game.home!=null&&mine(game.home)?game.home:ownedList()[0];if(h!=null)game.forces[h]=gar(h)+Math.round(o.troops*back*.6)}
  addLog('Withdrawal',`Forces pulled back from ${COUNTRY.get(o.to).n}.`)}

/* ---------- persistence ---------- */
function save(){try{localStorage.setItem(STORE,JSON.stringify(game))}catch(e){}}
function load(){try{const g=JSON.parse(localStorage.getItem(STORE)||'null');if(g&&g.v===1&&(g.phase==='play')&&COUNTRY.has(g.home)){game={...newGame(),...g};game.lv={...newGame().lv,...g.lv};game.st={...newGame().st,...g.st};game.ops=(g.ops||[]).filter(o=>COUNTRY.has(o.from)&&COUNTRY.has(o.to));dirty();return true}}catch(e){}return false}

/* ================= Map view + battle animation engine ================= */
const RIVAL_PAL=['#b5473a','#8e4f8a','#4f7fa6','#a8613a','#7b5aa6','#3f8a78','#b0435f','#7d8a3a','#c06a2e','#5a6fb0','#9a3b3b','#6a8a9a'];
function facColor(f){if(f==='P')return'#f4c64f';let h=0;for(const ch of String(f))h=(h*31+ch.charCodeAt(0))>>>0;return RIVAL_PAL[h%RIVAL_PAL.length]}
const NEUTRAL='#d3cbab';
const shade=(hex,amt)=>{const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=amt<0?0:255,t=Math.abs(amt);r=Math.round(r+(f-r)*t);g=Math.round(g+(f-g)*t);b=Math.round(b+(f-b)*t);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)};
function sideColor(id){const o=own(id);return o==='P'?facColor('P'):o===String(id)?NEUTRAL:facColor(o)}

/* ---------- viewport ---------- */
const View={x:0,y:0,w:1440,h:720,W:1,H:1,s:1,k:1};
function frameSize(){const f=$('frame');View.W=f.clientWidth||1;View.H=f.clientHeight||1}
function setView(x,y,w){frameSize();const ratio=View.W/View.H;const maxH=1050,maxW=Math.min(1500,maxH*ratio);w=clamp(w,90,maxW);let h=w/ratio;
  const padY=Math.max(0,(h-720)/2)+60;x=clamp(x,-40,1480-w);y=clamp(y,-padY,720+padY-h);
  if(w>=1440){x=(1440-w)/2}
  Object.assign(View,{x,y,w,h,s:View.W/w});View.k=clamp(.45+.2*View.s,.6,1.6);
  $('world').setAttribute('viewBox',`${x} ${y} ${w} ${h}`)}
function centreOn(pt,w=View.w){setView(pt[0]-w/2,pt[1]-w/(View.W/View.H)/2,w)}
function zoomAt(f,sx=View.W/2,sy=View.H/2){const wx=View.x+sx/View.s,wy=View.y+sy/View.s,nw=clamp(View.w*f,90,99999);const ns=View.W/nw;setView(wx-sx/ns,wy-sy/ns,nw)}
let camAnim=null;
function flyTo(pt,w,ms=700){const a={x:View.x+View.w/2,y:View.y+View.h/2,w:View.w},b={x:pt[0],y:pt[1],w:w||View.w};let ax=a.x;const dx=b.x-ax;if(Math.abs(dx)>720)ax+=dx>0?1440:-1440;camAnim={a:{...a,x:ax},b,t0:performance.now(),ms}}
function stepCam(now){if(!camAnim)return;const t=clamp((now-camAnim.t0)/camAnim.ms,0,1),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;const {a,b}=camAnim;const w=Math.exp(lerp(Math.log(a.w),Math.log(b.w),e));
  frameSize();const h=w/(View.W/View.H);setView(lerp(a.x,b.x,e)-w/2,lerp(a.y,b.y,e)-h/2,w);if(t>=1)camAnim=null}

function battleGroups(){const g=new Map();for(const o of game.ops){if(o.stage!=='battle')continue;const k=o.to+'/'+(o.side==='P'?'P':o.fac);if(!g.has(k))g.set(k,[]);g.get(k).push(o)}return[...g.values()]}

  for(const o of game.ops){if(o.stage!=='travel'||o.side!=='AI'||!mine(o.to))continue;out.push(`<button class="chip panel def" data-watch="${o.id}"><span class="dot">${ico('shield')}</span><b>${esc(COUNTRY.get(o.to).n)}</b><span style="color:var(--muted)">${Math.max(0,o.dur-o.el).toFixed(1)}d</span></button>`)}

    <p class="p">${d==='Easy'?'A superpower start. Rivals will still punish over-extension.':d==='Normal'?'Enough strength to expand, but every invasion needs planning.':d==='Hard'?'You will need to pick fights carefully and spend wisely.':'Tiny, poor or isolated. Every pound and every soldier counts.'}</p>`,

/* ---------- invasion planner ---------- */
function planFor(id){const opts=optionsFor(id);const src=new Map();const friendly=mine(id);
  const byFrom=new Map();for(const o of opts){if(!byFrom.has(o.from))byFrom.set(o.from,[]);byFrom.get(o.from).push(o)}
  const sorted=[...byFrom.entries()].sort((a,b)=>Math.min(...a[1].map(x=>x.days))-Math.min(...b[1].map(x=>x.days)));
  sorted.forEach(([from,list],i)=>{const pref=list.find(x=>x.type==='land')||list.slice().sort((a,b)=>a.days-b.days)[0];src.set(from,{on:i===0&&!friendly,type:pref.type,pct:friendly?.5:.6})});

  app.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
    if(d.pick){goTo(+d.pick);return}
    if(d.goto){goTo(+d.goto);return}
    if(d.watch){const o=game.ops.find(x=>x.id===+d.watch);if(o){const pt=o.stage==='battle'?o.front:(()=>{const g=routeGeom(o),h=along(g,g.len*o.el/o.dur);return[h.x,h.y]})();flyTo(pt,120);if(innerWidth<980)closeSheet()}return}
    if(d.resupply){const o=game.ops.find(x=>x.id===+d.resupply);if(o&&resupply(o)){toast('Supplies on the way');renderSheet();save()}return}
    if(d.withdraw){const o=game.ops.find(x=>x.id===+d.withdraw);if(o){withdraw(o);renderSheet();save()}return}
    if(d.reinforce){goTo(+d.reinforce);return}
    if(d.up){if(buyUpgrade(d.up)){toast(UP[d.up].name+' upgraded','good');renderSheet();renderHud();save()}return}
    if(d.recon){const p=UI.plan;if(p&&buyRecon(p.target,+d.recon)){toast('Recon complete');p.fc=null;renderPlan();renderHud();save()}return}
    if(d.toggle){const p=UI.plan,s=p.src.get(+d.toggle);s.on=!s.on;p.fc=null;renderPlan();return}
    if(d.mode){const [f,k]=d.mode.split(':'),p=UI.plan;p.src.get(+f).type=k;p.fc=null;renderPlan();return}
    if(d.pkg){const [k,l]=d.pkg.split(':'),p=UI.plan;p.sup[k]=+l;p.fc=null;t.parentElement.querySelectorAll('.lvl').forEach((b,i)=>b.classList.toggle('on',i===+l));updatePlanFoot(true);return}
    switch(d.act){
      case'start':{const id=game.selected;startEmpire(id);closeSheet();const c=COUNTRY.get(id);flyTo(c.c,Math.min(Math.max(220,Math.sqrt(c.area)*40),700));renderHud();styleMap(true);
        toast(`Welcome, commander. Tap a neighbour to plan your first invasion.`,'good');break}
      case'launch':launchPlan();break;
      case'fort':if(UI.plan&&buyFort(UI.plan.target)){toast('Fortifications raised');renderPlan();save()}break;
      case'mobilise':{const n=mobilise();if(n){toast(`${brief(n)} conscripts raised`,'good');renderSheet();save()}break}
      case'reset':card(`<h2>Abandon this campaign?</h2><p>Your empire and all progress will be lost.</p><div class="row"><button class="btn" data-act="cancel">Keep playing</button><button class="btn warn" data-act="newgame">Start again</button></div>`);break;
      case'cancel':closeCard();break;
      case'newgame':game=newGame();dirty();try{localStorage.removeItem(STORE)}catch(e){}closeCard();parts.length=0;styleMap(true);flyTo([720,330],1440);openSheet('setup');renderHud();break;
      case'begin':closeCard();openSheet('setup');toast('Tap any country to inspect it');break;
      case'continue':closeCard();break;
    }});
  app.addEventListener('input',e=>{const t=e.target;const p=UI.plan;if(!p)return;
    if(t.dataset.pct){p.src.get(+t.dataset.pct).pct=+t.value;t.style.setProperty('--v',((+t.value-.05)/.95*100)+'%');updatePlanFoot(false)}
    if(t.dataset.supply!=null){p.sup.days=+t.value;t.style.setProperty('--v',((+t.value-2)/28*100)+'%');updatePlanFoot(false)}});
  app.addEventListener('change',e=>{if(e.target.matches('input[type=range]')&&UI.plan){UI.plan.fc=null;updatePlanFoot(true)}});
}

/* ---------- map input: pan, pinch, wheel, tap ---------- */
function bindMap(){const el=$('frame'),pts=new Map();let pan=null,pinch=null;
  el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;el.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});camAnim=null;
    if(pts.size===1)pan={x:e.clientX,y:e.clientY,vx:View.x,vy:View.y,moved:false};
    else if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),w:View.w,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};if(pan)pan.moved=true}});
  el.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});const r=el.getBoundingClientRect();
    if(pinch&&pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top;const target=pinch.w*pinch.d/Math.max(20,d);zoomAt(target/View.w,mx,my);return}
    if(!pan)return;const dx=e.clientX-pan.x,dy=e.clientY-pan.y;if(!pan.moved&&Math.hypot(dx,dy)>7)pan.moved=true;if(pan.moved){el.classList.add('drag');setView(pan.vx-dx/View.s,pan.vy-dy/View.s,View.w)}});
  const end=e=>{const wasTap=pan&&!pan.moved&&!pinch&&pts.size===1;pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size){el.classList.remove('drag');if(wasTap&&e.type==='pointerup')tap(e.clientX,e.clientY);pan=null}else if(pts.size===1){const [p]=[...pts.values()];pan={x:p.x,y:p.y,vx:View.x,vy:View.y,moved:true}}};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('wheel',e=>{e.preventDefault();const r=el.getBoundingClientRect();camAnim=null;zoomAt(Math.pow(1.0018,e.deltaY),e.clientX-r.left,e.clientY-r.top)},{passive:false});
  function tap(x,y){if($('veil').classList.contains('show'))return;const hit=document.elementsFromPoint(x,y).find(n=>n.classList&&n.classList.contains('ctry'));
    if(hit){const id=+hit.dataset.id;if(id===game.selected&&UI.mode!=='none')return;choose(id)}else if(UI.mode==='plan'||UI.mode==='setup'){if(game.phase==='setup'){game.selected=null;renderSetup();styleMap()}else closeSheet()}}}

/* ---------- loop ---------- */
let lastT=0,hudT=0,sheetT=0,saveT=0;
function loop(now){const dt=clamp((now-(lastT||now))/1000,0,.1);lastT=now;
  if(game.phase==='play'&&!game.paused&&UI.mode!=='plan')simulate(dt*game.speed/DAY_SEC);
  stepCam(now);drawFx(now);
  if(now-hudT>250){hudT=now;renderHud();renderChips();styleMap()}
  if(now-sheetT>1000){sheetT=now;if(['forces','intel','command'].includes(UI.mode)&&!document.activeElement?.matches?.('input'))renderSheet();else if(UI.mode==='plan'&&!dragging())refreshPlanLive()}
  if(now-saveT>5000){saveT=now;if(game.phase==='play')save()}
  requestAnimationFrame(loop)}
const dragging=()=>document.activeElement&&document.activeElement.matches&&document.activeElement.matches('input[type=range]');
function refreshPlanLive(){const p=UI.plan;if(!p)return;// target may have changed hands or a source vanished
  if(game.selected!==p.target)return;const fresh=optionsFor(p.target);const key=fresh.map(o=>o.from+o.type).join(',');const old=p.opts.map(o=>o.from+o.type).join(',');
  if(key!==old||(mine(p.target)!==p.wasMine&&p.wasMine!==undefined)){UI.plan=planFor(p.target);UI.plan.wasMine=mine(p.target);renderPlan();return}p.wasMine=mine(p.target);p.opts=fresh;updatePlanFoot(false)}

/* ---------- boot ---------- */
function title(){card(`<div class="stripe">${stripe()}</div><h1>ATLAS V</h1><p>Pick one country. Fund every invasion from its treasury. Take the world by land, sea and air.</p>
  <ol class="steps"><li>Choose a homeland. Small nations make a harder game.</li><li>Tap a target and plan the invasion: which forces, which route, and what support you can afford.</li><li>Watch it play out. Tanks roll, fleets land troops, paratroopers drop, and the map changes hands.</li></ol>
  <button class="btn pri full" data-act="begin">Choose your homeland</button>`)}
function boot(){initMap();sizeFx();bindUI();bindMap();const had=load();frameSize();
  if(had){const c=COUNTRY.get(mine(game.home)?game.home:ownedList()[0]);setView(0,0,1440);centreOn(c.c,Math.max(260,View.w*.4));game.selected=null;renderHud();styleMap(true);
    card(`<div class="stripe">${stripe()}</div><h2>Welcome back</h2><p>The empire of ${esc(COUNTRY.get(game.home).n)} holds ${ownedList().length} territories on day ${Math.floor(game.day)}.</p><button class="btn pri full" data-act="continue">Resume campaign</button>`)}
  else{setView(0,0,1440);centreOn([720,330],1440);renderHud();styleMap(true);title()}
  addEventListener('resize',()=>{sizeFx();setView(View.x,View.y,View.w)});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.phase==='play')save()});
  requestAnimationFrame(loop)}
boot();

if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
